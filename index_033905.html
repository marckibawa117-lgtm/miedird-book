<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miedird Book</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c5f8d">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#1d2733;--mute:#6b7782;--line:#d9e0dc;--acc:#2c5f8d;--accink:#fff;--danger:#b3412f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a1f;--card:#1c242b;--ink:#e6ecef;--mute:#8e9aa4;--line:#2c3740;--acc:#7fb0dc;--accink:#0f1a24;--danger:#e0806e}}
:root[data-theme="dark"]{--bg:#141a1f;--card:#1c242b;--ink:#e6ecef;--mute:#8e9aa4;--line:#2c3740;--acc:#7fb0dc;--accink:#0f1a24;--danger:#e0806e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Literata",Georgia,serif;-webkit-text-size-adjust:100%}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
h1{font-size:26px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--accink);font-weight:600}
button.ghost{background:transparent;color:var(--acc);padding:10px 6px}
button.del{background:transparent;color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.search{margin:0 18px 8px;width:calc(100% - 36px);padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.status{margin:0 18px;font-size:13px;color:var(--mute)}
ul{list-style:none;margin:8px 0 0;padding:0 18px 90px}
li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px 12px 12px 6px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
li b{display:block;font-weight:600}
li span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li small{color:var(--mute);font-size:12px}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
.editor{display:flex;flex-direction:column;flex:1;padding:0 18px 18px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.title{border:0;background:transparent;color:var(--ink);font:600 24px/1.3 "Literata",Georgia,serif;padding:6px 0;width:100%}
.body{flex:1;min-height:55vh;border:0;background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);color:var(--ink);font:17px/28px "Literata",Georgia,serif;padding:0;resize:none;width:100%}
.title::placeholder,.body::placeholder{color:var(--mute)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:0;padding:14px 0}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
body.editing nav{display:none}
#bibleView{padding-bottom:140px}
.bwrap{padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:8px 0 18px}
.grid button{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:10px 6px;font-size:15px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
h2{font-size:15px;color:var(--mute);font-weight:600;margin:16px 0 4px}
.verse{padding:6px 4px;border-radius:6px;cursor:pointer;font-size:18px;line-height:1.65}
.verse.sel{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.vn{color:var(--acc);font-size:12px;font-weight:600;vertical-align:super;margin-right:4px}
.rbar{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.rbar b{flex:1;text-align:center;font-size:19px}
.act{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;justify-content:center;z-index:4}
.hit{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.hit b{display:block;color:var(--acc);font-size:14px}
.foot{font-size:12px;color:var(--mute);margin:18px 0}
.cgrid{grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.cgrid button{aspect-ratio:1;padding:0;font-size:18px;font-weight:600;border-radius:12px;display:flex;align-items:center;justify-content:center}
.cgrid button.cur{background:var(--acc);color:var(--accink);border-color:var(--acc)}
@media (min-width:480px){.cgrid{grid-template-columns:repeat(8,1fr)}}
.csub{text-align:center;color:var(--mute);font-size:14px;margin:2px 0 0}
.auth input{display:block;width:100%;margin:6px 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.auth label{font-size:14px;color:var(--mute)}
.auth .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden{display:none}
</style>
</head>
<body class="editing">
<div class="app">
  <section id="authView" class="auth hidden">
    <header><h1>Miedird Book</h1></header>
    <form id="authForm" class="bwrap">
      <p class="status" style="margin:0 0 14px">Connecte-toi pour retrouver tes notes sur tous tes appareils.</p>
      <label for="em">Adresse email</label><input id="em" type="email" autocomplete="email" required>
      <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="row"><button type="submit">Se connecter</button><button type="button" class="ghost" id="signupBtn">Créer un compte</button></div>
      <p><button type="button" class="ghost" id="forgotBtn">Mot de passe oublié</button></p>
      <p id="amsg" class="status" style="margin:6px 0" role="status"></p>
    </form>
  </section>
  <section id="listView" class="hidden">
    <header><h1>Miedird Book</h1><button class="ghost" id="outBtn">Déconnexion</button><button id="newBtn">Nouvelle note</button></header>
    <input id="q" class="search" type="search" placeholder="Rechercher une note" aria-label="Rechercher une note">
    <p id="status" class="status"></p>
    <ul id="list"></ul>
  </section>
  <section id="editView" class="editor hidden">
    <div class="bar"><button class="ghost" id="backBtn">Retour</button><span id="saved" class="status"></span><button class="del" id="delBtn">Supprimer</button></div>
    <input id="title" class="title" placeholder="Titre" aria-label="Titre">
    <textarea id="body" class="body" placeholder="Écris ta note ici" aria-label="Contenu de la note"></textarea>
  </section>
  <section id="bibleView" class="hidden">
    <header><h1>Bible</h1></header>
    <div id="bContent" class="bwrap"></div>
  </section>
</div>
<div id="act" class="act hidden"><button id="toNote">Copier dans une note</button><button class="ghost" id="clr">Annuler</button></div>
<nav><div><button id="tabN" aria-current="true">Notes</button><button id="tabB" aria-current="false">Bible</button></div></nav>
<script>
(function(){
  var notes=[],col=null,current=null,timer=null,mode="local";
  var $=function(i){return document.getElementById(i)};
  function lsGet(){try{return JSON.parse(localStorage.getItem("carnet_notes")||"[]")}catch(e){return []}}
  function lsSet(){try{localStorage.setItem("carnet_notes",JSON.stringify(notes))}catch(e){}}
  function fmt(t){return new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
  function render(){
    var q=$("q").value.trim().toLowerCase(),ul=$("list");ul.innerHTML="";
    var shown=notes.filter(function(n){return !q||((n.title||"")+" "+(n.body||"")).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (b.updated||0)-(a.updated||0)});
    if(!shown.length){var e=document.createElement("div");e.className="empty";e.textContent=notes.length?"Aucune note ne correspond à ta recherche.":"Aucune note pour l'instant. Touche « Nouvelle note » pour commencer.";ul.appendChild(e);return}
    shown.forEach(function(n){
      var li=document.createElement("li"),b=document.createElement("b"),s=document.createElement("span"),m=document.createElement("small");
      b.textContent=n.title||"Sans titre";s.textContent=(n.body||"").replace(/\s+/g," ");m.textContent=fmt(n.updated||Date.now());
      li.appendChild(b);li.appendChild(s);li.appendChild(m);li.onclick=function(){open(n.id)};ul.appendChild(li);
    });
  }
  function open(id){
    current=notes.filter(function(n){return n.id===id})[0];if(!current)return;
    $("title").value=current.title||"";$("body").value=current.body||"";$("saved").textContent="";
    $("listView").classList.add("hidden");$("editView").classList.remove("hidden");document.body.classList.add("editing");
    if(!current.title&&!current.body)$("title").focus();
  }
  function close(){flush();current=null;$("editView").classList.add("hidden");$("listView").classList.remove("hidden");document.body.classList.remove("editing");render()}
  function persist(n){
    if(mode==="cloud"){return col.doc(n.id).set({title:n.title,body:n.body,updated:n.updated}).then(function(){$("saved").textContent="Enregistré"}).catch(function(){$("saved").textContent="Échec de l'enregistrement"})}
    lsSet();$("saved").textContent="Enregistré sur cet appareil";
  }
  function flush(){if(timer){clearTimeout(timer);timer=null;if(current)persist(current)}}
  function edit(){
    if(!current)return;current.title=$("title").value;current.body=$("body").value;current.updated=Date.now();
    $("saved").textContent="Enregistrement…";clearTimeout(timer);timer=setTimeout(function(){timer=null;persist(current)},600);
  }
  $("title").oninput=edit;$("body").oninput=edit;$("q").oninput=render;$("backBtn").onclick=close;
  $("newBtn").onclick=function(){
    var n={id:"n"+Date.now().toString(36),title:"",body:"",updated:Date.now()};notes.push(n);open(n.id);
  };
  $("delBtn").onclick=function(){
    if(!current||!confirm("Supprimer cette note ? Cette action est définitive."))return;
    var id=current.id;clearTimeout(timer);timer=null;current=null;
    notes=notes.filter(function(n){return n.id!==id});
    if(mode==="cloud")col.doc(id).delete().catch(function(){});else lsSet();
    $("editView").classList.add("hidden");$("listView").classList.remove("hidden");document.body.classList.remove("editing");render();
  };
  function local(msg){mode="local";notes=lsGet();$("status").textContent=msg;render()}
  var cfg=window.MB_CONFIG||{},sb=null,uid=null;
  function amsg(t,err){var m=$("amsg");m.textContent=t;m.style.color=err?"var(--danger)":"var(--mute)"}
  function tr(e){var m=e.message||"";if(/Invalid login/i.test(m))return "Email ou mot de passe incorrect.";if(/not confirmed/i.test(m))return "Confirme d'abord ton email avec le lien reçu.";if(/already registered/i.test(m))return "Un compte existe déjà avec cet email.";return m}
  function showAuth(){document.body.classList.add("editing");$("authView").classList.remove("hidden");$("listView").classList.add("hidden");$("bibleView").classList.add("hidden")}
  function mkcol(){return {doc:function(id){return {
    set:function(d){return Promise.resolve(sb.from("notes").upsert({user_id:uid,id:id,title:d.title,body:d.body,updated:d.updated},{onConflict:"user_id,id"})).then(function(r){if(r.error)throw r.error})},
    delete:function(){return Promise.resolve(sb.from("notes").delete().eq("id",id)).then(function(r){if(r.error)throw r.error})}}}}}
  async function start(session){
    uid=session.user.id;col=mkcol();mode="cloud";
    $("authView").classList.add("hidden");document.body.classList.remove("editing");$("listView").classList.remove("hidden");
    $("status").textContent="Connecté : "+session.user.email;
    var r=await sb.from("notes").select("id,title,body,updated").order("updated",{ascending:false});
    if(r.error){$("status").textContent="Impossible de charger tes notes. Réessaie plus tard.";return}
    notes=r.data.map(function(x){return{id:x.id,title:x.title,body:x.body,updated:Number(x.updated)}});render();
  }
  $("authForm").onsubmit=async function(e){e.preventDefault();amsg("Connexion…");
    var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(r.error)amsg(tr(r.error),true);else start(r.data.session)};
  $("signupBtn").onclick=async function(){var em=$("em").value.trim(),pw=$("pw").value;
    if(!em){amsg("Entre ton adresse email.",true);return}
    if(pw.length<8){amsg("Choisis un mot de passe d'au moins 8 caractères.",true);return}
    amsg("Création du compte…");var r=await sb.auth.signUp({email:em,password:pw});
    if(r.error){amsg(tr(r.error),true);return}
    if(r.data.session)start(r.data.session);else amsg("Compte créé. Ouvre le lien reçu par email pour le confirmer, puis connecte-toi.")};
  $("forgotBtn").onclick=async function(){var em=$("em").value.trim();
    if(!em){amsg("Entre d'abord ton adresse email.",true);return}
    var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    if(r.error)amsg(tr(r.error),true);else amsg("Email envoyé : ouvre le lien reçu pour choisir un nouveau mot de passe.")};
  $("outBtn").onclick=async function(){await sb.auth.signOut();location.reload()};
  (async function init(){
    if(!cfg.url||!cfg.key||!window.supabase){showAuth();amsg("Configuration manquante : renseigne le fichier config.js.",true);return}
    sb=window.supabase.createClient(cfg.url,cfg.key);
    sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){var p=prompt("Nouveau mot de passe (8 caractères minimum) :");
      if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(function(r){alert(r.error?"Échec : "+r.error.message:"Mot de passe modifié.")})}});
    var s=await sb.auth.getSession();if(s.data.session)start(s.data.session);else showAuth();
  })();
  
  var bible=null,bi=0,chn=0,sel={},idx=null,sq="";
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
  function getB(){return bible}
  function loadBible(){if(bible){bBooks();return}var c=$("bContent");c.textContent="Chargement de la Bible…";
    fetch("bible.json").then(function(r){return r.json()}).then(function(j){bible=j;if(!$("bibleView").classList.contains("hidden"))bBooks()}).catch(function(){c.textContent="Impossible de charger la Bible. Vérifie que le fichier bible.json est en ligne."})}
  function tab(t){var b=t==="b";$("listView").classList.toggle("hidden",b);$("bibleView").classList.toggle("hidden",!b);
    $("tabN").setAttribute("aria-current",String(!b));$("tabB").setAttribute("aria-current",String(b));$("act").classList.add("hidden");
    if(b){loadBible()}else render();window.scrollTo(0,0)}
  $("tabN").onclick=function(){tab("n")};$("tabB").onclick=function(){tab("b")};
  function bBooks(){
    var c=$("bContent");c.innerHTML="";sel={};$("act").classList.add("hidden");
    var s=el("input","search");s.type="search";s.placeholder="Rechercher un mot dans la Bible";s.value=sq;s.style.cssText="margin:0 0 8px;width:100%";
    var out=el("div");c.appendChild(s);c.appendChild(out);
    function fill(){
      out.innerHTML="";var q=norm(sq.trim());
      if(q.length>=3){
        if(!idx){idx=[];getB().forEach(function(b,i){b.ch.forEach(function(ch,j){ch.forEach(function(v){idx.push({i:i,j:j,v:v[0],t:v[1],n:norm(v[1])})})})})}
        var r=idx.filter(function(x){return x.n.indexOf(q)>-1});
        out.appendChild(el("p","status",r.length+(r.length>1?" versets trouvés":" verset trouvé")+(r.length>80?" (80 premiers affichés)":"")));
        r.slice(0,80).forEach(function(x){var d=el("div","hit");d.appendChild(el("b","",bible[x.i].n+" "+(x.j+1)+":"+x.v));d.appendChild(el("span","",x.t));d.onclick=function(){bi=x.i;chn=x.j;bRead()};out.appendChild(d)});
        return}
      [["Ancien Testament",0,39],["Nouveau Testament",39,66]].forEach(function(g){
        out.appendChild(el("h2","",g[0]));var gr=el("div","grid");
        for(var i=g[1];i<g[2];i++)(function(i){var b=el("button","",bible[i].n);b.onclick=function(){bi=i;chn=-1;bChaps()};gr.appendChild(b)})(i);
        out.appendChild(gr)});
      out.appendChild(el("p","foot","Louis Segond 1910, domaine public."));
    }
    var t=null;s.oninput=function(){sq=s.value;clearTimeout(t);t=setTimeout(fill,250)};fill();
  }
  function bChaps(){
    var c=$("bContent");c.innerHTML="";var bk=bible[bi];
    var r=el("div","rbar"),back=el("button","ghost","Retour");back.onclick=bBooks;r.appendChild(back);r.appendChild(el("b","",bk.n));c.appendChild(r);
    c.appendChild(el("p","csub",bk.ch.length+(bk.ch.length>1?" chapitres":" chapitre")));var g=el("div","grid cgrid");bk.ch.forEach(function(_,j){var b=el("button",j===chn?"cur":"",String(j+1));b.onclick=function(){chn=j;bRead()};g.appendChild(b)});c.appendChild(g);window.scrollTo(0,0)}
  function bRead(){
    var c=$("bContent");c.innerHTML="";sel={};$("act").classList.add("hidden");var bk=bible[bi],vs=bk.ch[chn];
    var r=el("div","rbar"),p=el("button","ghost","‹"),n=el("button","ghost","›"),t=el("button","ghost",bk.n+" "+(chn+1));
    t.style.flex="1";t.style.fontSize="19px";t.style.color="var(--ink)";t.onclick=bChaps;
    p.onclick=function(){if(chn>0)chn--;else if(bi>0){bi--;chn=bible[bi].ch.length-1}bRead()};
    n.onclick=function(){if(chn<bk.ch.length-1)chn++;else if(bi<65){bi++;chn=0}bRead()};
    p.setAttribute("aria-label","Chapitre précédent");n.setAttribute("aria-label","Chapitre suivant");
    r.appendChild(p);r.appendChild(t);r.appendChild(n);c.appendChild(r);
    vs.forEach(function(v,k){var d=el("div","verse");d.appendChild(el("span","vn",v[0]));d.appendChild(document.createTextNode(v[1]));
      d.onclick=function(){if(sel[k]){delete sel[k]}else sel[k]=1;d.classList.toggle("sel",!!sel[k]);$("act").classList.toggle("hidden",!Object.keys(sel).length)};c.appendChild(d)});
    c.appendChild(el("p","foot","Touche un ou plusieurs versets pour les copier dans une note."));window.scrollTo(0,0);
  }
  $("clr").onclick=function(){sel={};$("act").classList.add("hidden");document.querySelectorAll(".verse.sel").forEach(function(d){d.classList.remove("sel")})};
  $("toNote").onclick=function(){
    var bk=bible[bi],ks=Object.keys(sel).map(Number).sort(function(a,b){return a-b}),vs=bk.ch[chn];
    var ref=bk.n+" "+(chn+1)+":"+ks.map(function(k){return vs[k][0]}).join(", ");
    var n={id:"n"+Date.now().toString(36),title:ref,body:ks.map(function(k){return vs[k][0]+" "+vs[k][1]}).join("\n")+"\n\n— "+ref+" (Louis Segond 1910)\n\n",updated:Date.now()};
    notes.push(n);current=n;persist(n);sel={};tab("n");open(n.id);$("body").focus();
  };
  render();
})();
</script>
</body>
</html>
